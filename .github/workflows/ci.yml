name: CI Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CI: true


jobs:
  test-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Check
        run: pnpm run lint

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Unit & Integration Tests
        run: pnpm run test

      - name: Application Production Build
        run: pnpm run build

      - name: Documentation Static Build
        run: |
          node scripts/docs-data/index.mjs
          pnpm run docs:build
