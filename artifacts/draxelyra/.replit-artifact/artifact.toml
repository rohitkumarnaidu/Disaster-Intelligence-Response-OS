kind = "web"
previewPath = "/"
title = "DRAXELYRA"
description = "A disaster intelligence and response operations console that turns post-disaster imagery into explainable priorities, accountable field tasks, and verified outcomes for emergency management teams."
version = "1.0.0"
id = "artifacts/draxelyra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20765

[services.development]
run = "pnpm --filter @workspace/draxelyra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/draxelyra", "run", "build" ]
serve = "static"
publicDir = "artifacts/draxelyra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20765"
BASE_PATH = "/"
